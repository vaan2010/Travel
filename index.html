    /* ===== Render ===== */
    function renderTripUI() {
      if (!tripState) return;
      ensureContent();
      warmAvatarsForNames(Object.keys(tripState.members || {}));
      $("tripTitleHead").textContent = tripState.title || "行程";
      $("editTripCode").textContent = tripState.code || currentTripCode;
      if (activeDayIdx >= tripState.content.days.length) activeDayIdx = Math.max(0, tripState.content.days.length - 1);
      renderDayTabs();
      renderTimeline();
      renderWishlist();
      renderPresence();
      if (activeTab === "money") renderMoney();
      if (activeTab === "prep") renderPrep();
      if (activeTab === "more") { renderMembers(); }
    }

    function renderPresence() {
      const el = $("presenceRow");
      if (!el) return;
      el.innerHTML = "";
      const now = Date.now();
      const names = new Set();
      Object.keys(presenceState || {}).forEach((k) => {
        const v = presenceState[k];
        if (v && now - (v.at || 0) < PRESENCE_TTL_MS) names.add(v.name || k);
      });
      if (tripState && tripState.members) Object.keys(tripState.members).forEach((m) => names.add(m));
      warmAvatarsForNames([...names]);
      [...names].forEach((n) => {
        const online = isUserOnline(n);
        const span = document.createElement("div");
        span.className = "avatar" + (n === accountName ? " is-me" : "") + (online ? " is-online" : "");
        applyAvatarToEl(span, n);
        span.title = n + (online ? " (在線)" : "");
        el.appendChild(span);
      });
      if (activeTab === "more") renderMembers();
    }

    function renderDayTabs() {
      ensureContent();
      const tabs = $("dayTabs");
      tabs.innerHTML = "";
      tripState.content.days.forEach((d, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "day-tab" + (i === activeDayIdx ? " is-active" : "");
        b.textContent = d.label || ("Day " + (i + 1));
        b.addEventListener("click", () => { activeDayIdx = i; renderDayTabs(); renderTimeline(); });
        tabs.appendChild(b);
      });
      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "day-tab day-tab-add";
      addBtn.textContent = "+ 新增";
      addBtn.addEventListener("click", () => {
        ensureContent();
        const n = tripState.content.days.length + 1;
        tripState.content.days.push({ id: uid(), label: "Day " + n, items: [] });
        activeDayIdx = n - 1;
        schedulePush({ action: "新增一天", detail: "Day " + n });
        renderDayTabs(); renderTimeline();
      });
      tabs.appendChild(addBtn);
    }

    // TODO(map): 地圖功能暫時停用（保留註解位置，日後可恢復 geocode 與地圖渲染邏輯）

    function cropImageToCover(file, width = 720, height = 400) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("請選擇圖片檔"));
          return;
        }
        if (file.size > 12 * 1024 * 1024) {
          reject(new Error("圖片請小於 12MB"));
          return;
        }
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            const scale = Math.max(width / img.width, height / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            ctx.drawImage(img, (width - w) / 2, (height - h) / 2, w, h);
            URL.revokeObjectURL(url);
            let quality = 0.78;
            let data = canvas.toDataURL("image/jpeg", quality);
            while (data.length > 280000 && quality > 0.45) {
              quality -= 0.08;
              data = canvas.toDataURL("image/jpeg", quality);
            }
            resolve(data);
          } catch (e) {
            URL.revokeObjectURL(url);
            reject(e);
          }
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("無法讀取圖片")); };
        img.src = url;
      });
    }

    function applyPlaceCover(card, item) {
      const main = card.querySelector(".place-head-main");
      if (!main) return;
      if (item.coverImage) {
        card.classList.add("has-cover");
        main.classList.add("has-cover");
        main.style.backgroundImage = "url(" + JSON.stringify(item.coverImage) + ")";
      } else {
        card.classList.remove("has-cover");
        main.classList.remove("has-cover");
        main.style.backgroundImage = "";
      }
    }

    function tagHtml(tags) {
      return (tags || []).map((t) => {
        const meta = TAGS.find((x) => x.id === t) || TAGS[5];
        return `<span class="tag tag-${meta.id}">${meta.label}</span>`;
      }).join("");
    }

    function fillPlaceCardContent(card, item, withTime) {
      const costStr = item.cost ? `${item.currency || "TWD"} ${item.cost}` : "—";
      const head = card.querySelector(".place-head-main") || card.querySelector(".place-head > div:last-child");
      if (!head) return;
      const title = head.querySelector(".place-title");
      if (title) title.textContent = item.place || (withTime ? "未命名景點" : "未命名");

      let tagsEl = head.querySelector(".place-tags");
      let durEl = head.querySelector(".place-dur");
      let costEl = head.querySelector(".place-cost");
      let meta = head.querySelector(".place-meta:not(.place-addr):not(.place-tags):not(.place-dur):not(.place-cost)");

      if (withTime) {
        if (meta) meta.remove();
        if (!tagsEl) {
          tagsEl = document.createElement("div");
          tagsEl.className = "place-meta place-tags";
          const after = title ? title.nextSibling : head.firstChild;
          head.insertBefore(tagsEl, after);
        }
        tagsEl.innerHTML = tagHtml(item.tags);
        if (!durEl) {
          durEl = document.createElement("div");
          durEl.className = "place-meta place-dur";
          tagsEl.insertAdjacentElement("afterend", durEl);
        }
        durEl.textContent = `停留 ${formatDurationLabel(resolveItemDuration(item))}`;
        if (!costEl) {
          costEl = document.createElement("div");
          costEl.className = "place-meta place-cost";
          durEl.insertAdjacentElement("afterend", costEl);
        }
        costEl.textContent = `花費 ${costStr}`;
      } else {
        if (durEl) durEl.remove();
        if (costEl) costEl.remove();
        if (!tagsEl) {
          tagsEl = head.querySelector(".place-meta") || document.createElement("div");
          tagsEl.className = "place-meta place-tags";
          if (!tagsEl.parentNode) head.appendChild(tagsEl);
        }
        tagsEl.innerHTML = tagHtml(item.tags);
      }

      let noteEl = head.querySelector(".place-note");
      if (item.note && String(item.note).trim()) {
        if (!noteEl) {
          noteEl = document.createElement("div");
          noteEl.className = "place-note";
          head.appendChild(noteEl);
        }
        noteEl.textContent = item.note;
      } else if (noteEl) {
        noteEl.remove();
      }
      let addrEl = head.querySelector(".place-addr");
      if (item.address) {
        if (!addrEl) {
          addrEl = document.createElement("div");
          addrEl.className = "place-meta place-addr";
          head.appendChild(addrEl);
        }
        addrEl.textContent = item.address;
      } else if (addrEl) {
        addrEl.remove();
      }
    }

    function collectAllPlaceItems() {
      const mapItems = {};
      (tripState.content.days || []).forEach((d) => {
        (d.items || []).forEach((it) => { mapItems[it.id] = it; });
      });
      (tripState.content.wishlist || []).forEach((it) => { mapItems[it.id] = it; });
      return mapItems;
    }

    let syncPlacesTimer = null;
    function scheduleSyncPlaces(action) {
      clearTimeout(syncPlacesTimer);
      syncPlacesTimer = setTimeout(() => syncDayAndWishlistFromDom(action), 0);
    }

    function syncDayAndWishlistFromDom(action) {
      if (applyingRemote || !tripState) return;
      ensureContent();
      const mapItems = collectAllPlaceItems();
      const dayWrap = $("timeline");
      const wishWrap = $("wishlist");
      const dayIds = [...dayWrap.querySelectorAll(".place-card")].map((el) => el.dataset.id).filter(Boolean);
      const wishIds = [...wishWrap.querySelectorAll(".place-card")].map((el) => el.dataset.id).filter(Boolean);
      const dayIdSet = new Set(dayIds);
      const wishIdSet = new Set(wishIds);

      if (tripState.content.days[activeDayIdx]) {
        tripState.content.days[activeDayIdx].items = dayIds.map((id) => mapItems[id]).filter(Boolean);
      }
      tripState.content.days.forEach((d, i) => {
        if (i === activeDayIdx) return;
        d.items = (d.items || []).filter((it) => !dayIdSet.has(it.id) && !wishIdSet.has(it.id));
      });
      tripState.content.wishlist = wishIds.map((id) => mapItems[id]).filter(Boolean);
      schedulePush({ action: action || "調整行程", detail: "" });
      renderTimeline();
      renderWishlist();
    }

    function renderTimeline() {
      if (!tripState || !tripState.content) return;
      const wrap = $("timeline");
      wrap.innerHTML = "";
      const day = tripState.content.days[activeDayIdx];
      if (!day) { wrap.innerHTML = '<p class="empty">尚無日程</p>'; return; }
      const items = day.items || [];
      if (!items.length) {
        const empty = document.createElement("p");
        empty.className = "empty timeline-empty";
        empty.textContent = "這天還沒有景點，按下方新增";
        wrap.appendChild(empty);
      }

      items.forEach((item) => {
        const lock = getLock(item.id);
        const lockedByOther = lock && lock.user !== accountName;
        const card = document.createElement("div");
        card.className = "place-card" + (lockedByOther ? " is-locked" : "");
        card.dataset.id = item.id;
        card.innerHTML = `
          <div class="drag-handle" title="長按拖曳">⋮⋮</div>
          <div class="place-head">
            <div class="place-time"></div>
            <div class="place-head-main" style="min-width:0;flex:1;">
              <p class="place-title"></p>
              <div class="place-meta place-tags"></div>
              ${lockedByOther ? `<span class="lock-badge">${lock.user} 編輯中</span>` : ""}
            </div>
          </div>`;
        const timeEl = card.querySelector(".place-time");
        const endDisp = displayEndTime(item);
        if (item.time && endDisp) {
          timeEl.classList.add("has-range");
          const durShort = formatDurationShort(resolveItemDuration(item));
          timeEl.innerHTML =
            `<span class="t-start">${item.time}</span>` +
            `<span class="t-mid" aria-hidden="true">` +
              `<span class="t-track"></span>` +
              `<span class="t-chip">${durShort}</span>` +
            `</span>` +
            `<span class="t-end">${endDisp}</span>`;
        } else if (item.time) {
          timeEl.classList.remove("has-range");
          timeEl.innerHTML = `<span class="t-only">${item.time}</span>`;
        } else {
          timeEl.classList.remove("has-range");
          timeEl.innerHTML = `<span class="t-only">--:--</span>`;
        }
        fillPlaceCardContent(card, item, true);
        applyPlaceCover(card, item);
        card.addEventListener("click", (e) => {
          if (e.target.closest(".drag-handle")) return;
          openPlaceSheet(item, activeDayIdx, false, "view");
        });
        wrap.appendChild(card);
      });

      if (daySortable) daySortable.destroy();
      daySortable = Sortable.create(wrap, {
        handle: ".drag-handle",
        animation: 160,
        delay: 180,
        delayOnTouchOnly: true,
        ghostClass: "sortable-ghost",
        chosenClass: "sortable-chosen",
        draggable: ".place-card",
        group: { name: "places", pull: true, put: true },
        emptyInsertThreshold: 48,
        onAdd: () => {
          const empty = wrap.querySelector(".timeline-empty");
          if (empty) empty.remove();
        },
        onEnd: () => scheduleSyncPlaces("調整景點順序"),
      });
    }

    function renderWishlist() {
      ensureContent();
      const wrap = $("wishlist");
      wrap.innerHTML = "";
      const list = tripState.content.wishlist || [];
      if (!list.length) {
        const empty = document.createElement("p");
        empty.className = "empty wishlist-empty";
        empty.style.padding = "6px 0";
        empty.textContent = "清單是空的";
        wrap.appendChild(empty);
      }
      list.forEach((item) => {
        const card = document.createElement("div");
        card.className = "place-card";
        card.dataset.id = item.id;
        card.innerHTML = `
          <div class="drag-handle">⋮⋮</div>
          <div class="place-head"><div class="place-head-main" style="flex:1;min-width:0;"><p class="place-title"></p><div class="place-meta"></div></div></div>`;

      if (!tripState || !tripState.content || !id) return null;
      for (const d of tripState.content.days || []) {
        const found = (d.items || []).find((x) => x.id === id);
        if (found) return found;
      }
      return (tripState.content.wishlist || []).find((x) => x.id === id) || null;
    }

    function infoRow(label, value, asHtml) {
      const row = document.createElement("div");
      row.className = "info-row";
      const lab = document.createElement("span");
      lab.className = "info-label";
      lab.textContent = label;
      row.appendChild(lab);
      const val = document.createElement("div");
      if (asHtml) {
        const empty = !value;
        val.className = "info-value" + (empty ? " is-empty" : "");
        val.innerHTML = empty ? "—" : value;
      } else {
        const empty = value == null || value === "";
        val.className = "info-value" + (empty ? " is-empty" : "");
        val.textContent = empty ? "—" : String(value);
      }
      row.appendChild(val);
      return row;
    }

      if (st === "bought") return "已買";

    const FX_META = [
      { code: "JPY", name: "日圓" },
      { code: "USD", name: "美元" },
      { code: "EUR", name: "歐元" },
      { code: "KRW", name: "韓元" },
      { code: "THB", name: "泰銖" },
    ];

    function roundFx(n, digits = 6) {
      const v = Number(n);
      if (!Number.isFinite(v)) return 0;
      const p = 10 ** digits;
      return Math.round(v * p) / p;
    }

    let fxMeasureCtx = null;
    function measureFxText(text, el) {
      if (!fxMeasureCtx) fxMeasureCtx = document.createElement("canvas").getContext("2d");
      const cs = getComputedStyle(el);
      fxMeasureCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      return fxMeasureCtx.measureText(text).width;
    }

    function fxDecimalsThatFit(el, raw) {
      const cs = getComputedStyle(el);
      const pad = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
      const avail = Math.max(0, (el.clientWidth || 0) - pad - 1);
      // 從多到少找「完整塞得進框」的小數位，避免顯示到一半被裁切
      for (let d = 6; d >= 0; d--) {
        const s = roundFx(raw, d).toFixed(d);
        if (measureFxText(s, el) <= avail) return d;
      }
      return 0;
    }

    function applyFxDisplay(el) {
      if (!el || document.activeElement === el) return;
      const raw = Number(el.dataset.rate ?? el.value);
      if (!Number.isFinite(raw)) return;
      const d = fxDecimalsThatFit(el, raw);
      el.value = roundFx(raw, d).toFixed(d);
      el.step = d > 0 ? (1 / 10 ** d).toFixed(d) : "1";
    }

    async function fetchOnlineFxRates() {
      // base=TWD → rates[X] = 1 TWD 可換多少 X；我們要的是 1 X = 多少 TWD
      const res = await fetch("https://open.er-api.com/v6/latest/TWD");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!data || data.result !== "success" || !data.rates) throw new Error("匯率資料格式錯誤");
      const rates = data.rates;
      const out = { TWD: 1 };
      FX_META.forEach(({ code }) => {
        const perTwd = Number(rates[code]);
        if (perTwd > 0) out[code] = roundFx(1 / perTwd, 6);
      });
      return {
        fx: out,
        updatedAt: data.time_last_update_utc || new Date().toISOString(),
      };
    }

    function fillFxInputs(fx) {
      FX_META.forEach(({ code }) => {
        const el = $("fx" + code);
        if (!el) return;
        el.dataset.rate = String(roundFx(fx[code] ?? DEFAULT_FX[code] ?? 0, 6));
        applyFxDisplay(el);
      });
    }

    function openFxSheet() {
      ensureContent();
      const fx = { ...DEFAULT_FX, ...(tripState.content.fx || {}) };
      const rows = FX_META.map(({ code, name }) => `
        <div class="fx-row">
          <div class="fx-code">${code}</div>
          <div class="fx-eq">
            <span class="fx-eq-label">1 ${name}</span>
            <span class="fx-eq-eq">=</span>
            <input id="fx${code}" type="number" step="any" value="" inputmode="decimal" data-rate="${roundFx(fx[code] ?? DEFAULT_FX[code], 6)}"/>
            <span class="fx-unit">TWD</span>
          </div>
        </div>
      `).join("");

      openSheet(
        "設定匯率",
        `
        <div class="fx-head">
          <div class="fx-head-actions">
            <button type="button" class="btn-primary" id="btnFetchFx">更新網路匯率</button>
          </div>
          <div class="fx-updated" id="fxUpdatedAt"></div>
        </div>
        <div class="fx-list">${rows}</div>
        `,
        `<button type="button" class="btn-primary" id="btnSaveFxSheet">儲存</button>`
      );

      const fxResizeObs = new ResizeObserver((entries) => {
        entries.forEach((entry) => applyFxDisplay(entry.target));
      });
      FX_META.forEach(({ code }) => {
        const el = $("fx" + code);
        if (!el) return;
        el.addEventListener("focus", () => {
          const raw = Number(el.dataset.rate ?? el.value);
          if (Number.isFinite(raw)) el.value = roundFx(raw, 6).toFixed(6);
        });
        el.addEventListener("input", () => { el.dataset.rate = el.value; });
        el.addEventListener("blur", () => applyFxDisplay(el));
        fxResizeObs.observe(el);
        applyFxDisplay(el);
      });

      const setStatus = (text) => {
        const el = $("fxUpdatedAt");
        if (el) el.textContent = text;
      };

      const applyOnline = async () => {
        const btn = $("btnFetchFx");
        if (btn) { btn.disabled = true; btn.textContent = "更新中…"; }
        setStatus("正在取得網路匯率…");
        try {
          const { fx: online, updatedAt } = await fetchOnlineFxRates();
          fillFxInputs(online);
          const when = updatedAt ? new Date(updatedAt).toLocaleString("zh-TW", {
            month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
          }) : "";
          setStatus(when ? `已更新 · ${when}` : "已更新");
          showToast("匯率已更新");
        } catch (e) {
          console.warn(e);
          setStatus("更新失敗");
          showToast("匯率更新失敗");
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = "更新網路匯率"; }
        }
      };

    function renderSettle() {
      ensureContent();
      const el = $("settleList");
      const badge = $("settleBadge");
      el.innerHTML = "";
      const net = {};
      (tripState.content.expenses || []).forEach((ex) => {
        const split = (ex.splitWith || []).filter(Boolean);
        if (!split.length) return;
        const each = (ex.amountTwd || 0) / split.length;
        net[ex.payer] = (net[ex.payer] || 0) + (ex.amountTwd || 0);
        split.forEach((p) => { net[p] = (net[p] || 0) - each; });
      });
      const creditors = [], debtors = [];
      Object.keys(net).forEach((p) => {
        const v = Math.round(net[p] * 100) / 100;
        if (v > 0.5) creditors.push({ p, v });
        else if (v < -0.5) debtors.push({ p, v: -v });
      });
      creditors.sort((a, b) => b.v - a.v);
      debtors.sort((a, b) => b.v - a.v);
      const transfers = [];
      let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        const pay = Math.min(debtors[i].v, creditors[j].v);
        transfers.push({ from: debtors[i].p, to: creditors[j].p, amount: Math.round(pay) });
        debtors[i].v -= pay; creditors[j].v -= pay;
        if (debtors[i].v < 0.5) i++;
        if (creditors[j].v < 0.5) j++;
      }
      if (!transfers.length) {
        if (badge) {
          badge.textContent = "已結清";
          badge.classList.add("is-done");
        }
        el.innerHTML = `<div class="settle-empty">目前無需轉帳</div>`;
        return;
      }
      if (badge) {
        badge.textContent = `${transfers.length} 筆建議`;
        badge.classList.remove("is-done");
      }
      transfers.forEach((t) => {
        const row = document.createElement("div");
        row.className = "settle-item";
        row.innerHTML = `
          <div class="settle-top">
            <div class="settle-flow">
              ${avatarSpanHtml(t.from, t.from === accountName ? "is-me" : "", t.from)}
              <span class="settle-arrow">→</span>
              ${avatarSpanHtml(t.to, t.to === accountName ? "is-me" : "", t.to)}
            </div>
            <div class="settle-amount">NT$ ${formatTwd(t.amount)}</div>
          </div>
        `;
        el.appendChild(row);
      });
    }

    const DOC_DB = "travelDocs";
    function openDocDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DOC_DB, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore("files"); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function saveDocBlob(id, blob, meta) {
      const db = await openDocDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction("files", "readwrite");
        tx.objectStore("files").put({ blob, meta }, id);
        tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
      });
    }
    async function getDocBlob(id) {
      const db = await openDocDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("files", "readonly");
        const req = tx.objectStore("files").get(id);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function deleteDocBlob(id) {
      const db = await openDocDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction("files", "readwrite");
        tx.objectStore("files").delete(id);
        tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
      });
    }

    function avatarStorageKey(serial, name) {
      const s = String(serial || "").trim();
      if (s) return "travel_profile_avatar_data:" + s;
      const n = String(name || "").trim().toLowerCase();
      return n ? "travel_profile_avatar_data:u:" + n : "travel_profile_avatar_data";
    }
    function avatarNameKey(name) {
      return String(name || "").trim().toLowerCase();
    }
    function getMyAvatarData() {
      const key = avatarNameKey(accountName);
      if (key && avatarCacheByName[key]) return avatarCacheByName[key];
      const storageKey = avatarStorageKey(accountSerial, accountName);
      return localStorage.getItem(storageKey) || "";
    }
    function setMyAvatarData(dataUrl, serial, name) {
      const n = name || accountName;
      const key = avatarStorageKey(serial || accountSerial, n);
      const v = String(dataUrl || "");
      if (v) localStorage.setItem(key, v);
      else localStorage.removeItem(key);
      const nkey = avatarNameKey(n);
      if (nkey) avatarCacheByName[nkey] = v;
    }
    async function compressAvatarFile(file) {
      // 壓縮成小圖，避免各瀏覽器/雲端不同步與過大寫入失敗
      return cropImageToCover(file, 160, 160);
    }
    async function publishAvatarToCloud(username, dataUrl, serial) {
      const key = avatarNameKey(username);
      const v = String(dataUrl || "");
      if (!key) return;
      await set(ref(rtdb, PATH_USER_AVATARS + "/" + key), {
        data: v,
        updatedAt: new Date().toISOString(),
        serial: serial || accountSerial || "",
      });
      if (serial || accountSerial) {
        await update(ref(rtdb, serial || accountSerial), { [ACCT_AVATAR]: v }).catch(() => {});
      }
      avatarCacheByName[key] = v;
      avatarWarmedOnce.add(key);
    }
    async function fetchAvatarDataForName(name) {
      const key = avatarNameKey(name);
      if (!key) return "";
      if (avatarFetchPromises.has(key)) return avatarFetchPromises.get(key);

      const p = (async () => {
        try {
          // 1) 共用公開頭像節點（跨瀏覽器一致）
          const avSnap = await get(ref(rtdb, PATH_USER_AVATARS + "/" + key));
          if (snapExists(avSnap)) {
            const val = avSnap.val();
            const data = typeof val === "string" ? val : (val && typeof val.data === "string" ? val.data : "");
            if (data) return data;
          }
          // 2) 備援：從帳號資料讀，並回填公開節點
          const resolved = await resolveAccount(name);
          if (!resolved) return "";
          const snap = await get(ref(rtdb, resolved.serial));
          if (!snapExists(snap)) return "";
          const acct = snap.val() || {};
          const data = typeof acct[ACCT_AVATAR] === "string" ? acct[ACCT_AVATAR] : "";
          if (data) {
            await set(ref(rtdb, PATH_USER_AVATARS + "/" + key), {
              data,
              updatedAt: new Date().toISOString(),
              serial: resolved.serial || "",
            }).catch(() => {});
          }
          return data;
        } catch {
          return "";
        } finally {
          avatarFetchPromises.delete(key);
        }
      })();
      avatarFetchPromises.set(key, p);
      const avatar = await p;
      avatarCacheByName[key] = avatar || "";
      avatarWarmedOnce.add(key);
      // 若是自己，同步本機快取為雲端版本（以雲端為準）
      if (avatarNameKey(name) === avatarNameKey(accountName)) {
        setMyAvatarData(avatar || "", accountSerial, accountName);
      }
      return avatar || "";
    }
    function refreshAvatarViews() {

      renderPresence();

    function warmAvatarsForNames(names) {
      const list = [...new Set((names || []).map((n) => String(n || "").trim()).filter(Boolean))];
      // 包含自己：一律以雲端為準，避免不同瀏覽器本機快取不一致
      const targets = list.filter((n) => {
        const key = avatarNameKey(n);
        return key && !avatarWarmedOnce.has(key);
      });
      if (!targets.length) return;
      Promise.all(targets.map((n) => fetchAvatarDataForName(n))).then(() => {
        refreshAvatarViews();
      }).catch(() => {});
    }
    async function syncMyAvatarWithCloud() {
      if (!accountSerial || isAdminSession() || !accountName) return;
      try {
        // 先拉雲端；有雲端就覆寫本機，確保跨瀏覽器一致
        const cloud = await fetchAvatarDataForName(accountName);
        if (cloud) return;
        // 雲端沒有、本機有：補上傳一次
        const localAvatar = localStorage.getItem(avatarStorageKey(accountSerial, accountName)) || "";
        if (!localAvatar) return;
        await publishAvatarToCloud(accountName, localAvatar, accountSerial);
      } catch {}
    }
    function getAvatarDataFor(name) {
      const key = avatarNameKey(name);
      if (!key) return "";
      // 顯示一律吃記憶體快取（由雲端灌入），不再優先吃本機舊圖
      if (Object.prototype.hasOwnProperty.call(avatarCacheByName, key)) return avatarCacheByName[key] || "";
      if (avatarNameKey(name) === avatarNameKey(accountName)) return getMyAvatarData();
      return "";
    }

        row.appendChild(meta);
        el.appendChild(row);
      });
    }

    function renderHistoryInto(list, empty) {
      if (!list) return;
      list.innerHTML = "";
      const hist = (tripState && tripState.history) || [];
      if (!hist.length) { empty?.classList.remove("hidden"); return; }
      empty?.classList.add("hidden");
      hist.forEach((h) => {
        const row = document.createElement("div");
        row.className = "expense-card";
        row.innerHTML = `<div><strong style="color:var(--accent-deep);"></strong> <span></span></div><div style="font-size:.75rem;color:var(--muted);margin-top:4px;"></div>`;
        row.querySelector("strong").textContent = h.user || "";
        row.querySelector("span").textContent = (h.action || "") + (h.detail ? " — " + h.detail : "");
        row.querySelectorAll("div")[1].textContent = h.at ? new Date(h.at).toLocaleString("zh-TW") : "";
        list.appendChild(row);
      });
    }
    function openHistorySheet() {
      openSheet("修改歷史", `
        <div id="historyList"></div>
        <p class="empty hidden" id="historyEmpty">尚無紀錄</p>
      `);
      renderHistoryInto($("historyList"), $("historyEmpty"));
    }
    async function openForgotPasswordSheet() {
      openSheet("忘記密碼", `
        <div class="field"><label>電子信箱</label><input id="fpEmail" type="email" placeholder="name@example.com" /></div>
        <div class="row">
          <div class="field"><label>驗證碼</label><input id="fpCode" type="text" inputmode="numeric" maxlength="6" placeholder="6 位數驗證碼" /></div>
          <button type="button" class="btn-ghost" id="btnSendFpCode">發送驗證碼</button>
        </div>
        <div class="field"><label>新密碼（至少 6 碼）</label><input id="fpPass1" type="password" placeholder="請輸入新密碼" /></div>
        <div class="field"><label>確認新密碼</label><input id="fpPass2" type="password" placeholder="請再次輸入新密碼" /></div>
      `, `<button type="button" class="btn-primary" id="btnResetPass">修改密碼</button>`);

      $("btnSendFpCode")?.addEventListener("click", async () => {
        try {
          if (!isEmailJsReady()) return alert("尚未設定寄信服務（EMAILJS_PUBLIC_KEY / SERVICE_ID / TEMPLATE_ID）");
          const email = ($("fpEmail").value || "").trim().toLowerCase();
          if (!isValidEmail(email)) return alert("請輸入有效電子信箱");
          const idxSnap = await get(accountEmailIndexRefFor(email));
          if (!snapExists(idxSnap)) return alert("找不到此電子信箱對應的帳號");
          const code = generateVerifyCode();
          await sendVerificationEmail(email, "reset", code);
          putVerifyCode(email, "reset", code);
          alert("驗證碼已寄到你的信箱，請到收件匣或垃圾信箱確認。");
        } catch (e) {
          alert(e.message || e);
        }
      });

      $("btnResetPass")?.addEventListener("click", async () => {
        try {
          const email = ($("fpEmail").value || "").trim().toLowerCase();
          const code = ($("fpCode").value || "").trim();
          const p1 = $("fpPass1").value || "";
          const p2 = $("fpPass2").value || "";
          if (!isValidEmail(email)) throw new Error("請輸入有效電子信箱");
          if (!consumeVerifyCode(email, "reset", code)) throw new Error("驗證碼錯誤或已過期");
          if (!p1 || p1.length < 6) throw new Error("新密碼至少 6 碼");
          if (p1 !== p2) throw new Error("兩次密碼不一致");
          const idxSnap = await get(accountEmailIndexRefFor(email));
          if (!snapExists(idxSnap)) throw new Error("找不到此電子信箱對應的帳號");
          const serial = idxSnap.val();
          const passHash = await sha256Hex(p1);
          await update(ref(rtdb, serial), { [ACCT_HASH]: passHash });
          closeSheet();
          showToast("密碼已修改");
        } catch (e) {
          alert(e.message || e);
        }
      });
    }

    /* ===== Trip list / admin ===== */
    function appendTripCard(listEl, { code, title, meta, missing }) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "trip-card";
      card.innerHTML = `<div><h3></h3><div class="meta"></div></div><span class="code-pill"></span>`;
      card.querySelector("h3").textContent = title;
      card.querySelector(".meta").textContent = meta;
      card.querySelector(".code-pill").textContent = code;
      if (missing) {
        card.addEventListener("click", () => { forgetJoined(code); refreshTripList(); });
      } else {
        card.addEventListener("click", () => showEditor(code));
      }
      listEl.appendChild(card);
    }

    async function refreshTripList() {
      const mineEl = $("tripListMine");
      const joinEl = $("tripListJoin");
      const mineEmpty = $("tripListMineEmpty");
      const joinEmpty = $("tripListJoinEmpty");
      const mineCount = $("mineTripCount");
      const joinCount = $("joinTripCount");
      if (!mineEl || !joinEl) return;

      mineEl.innerHTML = "";
      joinEl.innerHTML = "";
      const codes = getJoinedCodes();
      const ownedSet = new Set(getOwnedCodes());
      let mineN = 0, joinN = 0;

      if (!codes.length) {
        mineEmpty?.classList.remove("hidden");
        joinEmpty?.classList.remove("hidden");
        if (mineCount) mineCount.textContent = "";
        if (joinCount) joinCount.textContent = "";
        return;
      }

      for (const code of codes) {
        let title = code, meta = "", isMine = ownedSet.has(code), missing = false;
        try {
          const snap = await get(tripRef(code));
          if (!snapExists(snap)) {
            missing = true;
            title = "（已不存在）";
            meta = "點擊移除";
          } else {
            const v = snap.val() || {};
            title = v.title || code;
            meta = v.updatedBy ? `最近 ${v.updatedBy}` : (v.createdBy ? `建立：${v.createdBy}` : "");
            if (v.createdBy && v.createdBy === accountName) {
              isMine = true;
              if (!ownedSet.has(code)) rememberOwned(code);
            } else if (v.createdBy && v.createdBy !== accountName) {
              isMine = false;
            }
          }
        } catch {}

        if (missing) {
          // 無法判斷歸屬時兩邊都可清掉：先放到「已加入」
          joinN++;
          appendTripCard(joinEl, { code, title, meta, missing: true });
          continue;
        }
        if (isMine) {
          mineN++;
          appendTripCard(mineEl, { code, title, meta, missing: false });
        } else {
          joinN++;
          appendTripCard(joinEl, { code, title, meta, missing: false });
        }
      }

      mineEmpty?.classList.toggle("hidden", mineN > 0);
      joinEmpty?.classList.toggle("hidden", joinN > 0);
      if (mineCount) mineCount.textContent = mineN ? `共 ${mineN} 個` : "";
      if (joinCount) joinCount.textContent = joinN ? `共 ${joinN} 個` : "";
    }

    function setHomeTab(tab) {
      const mine = tab !== "join";
      document.querySelectorAll("#homeTabs button").forEach((btn) => {
        btn.classList.toggle("is-active", btn.getAttribute("data-home-tab") === (mine ? "mine" : "join"));
      });
      $("homePaneMine")?.classList.toggle("hidden", !mine);
      $("homePaneJoin")?.classList.toggle("hidden", mine);
    }

    async function refreshAdminTripList() {
      const listEl = $("adminTripList");
      const emptyEl = $("adminTripListEmpty");
      listEl.innerHTML = '<p class="empty">載入中…</p>';
      emptyEl.classList.add("hidden");
      try {
        const snap = await get(ref(rtdb, PATH_TRIPS));
        listEl.innerHTML = "";
        if (!snapExists(snap)) { emptyEl.classList.remove("hidden"); return; }
        const val = snap.val() || {};
        const codes = Object.keys(val).filter((k) => val[k] && typeof val[k] === "object");
        if (!codes.length) { emptyEl.classList.remove("hidden"); return; }
        codes.sort((a, b) => String(val[b].updatedAt || "").localeCompare(String(val[a].updatedAt || "")));
        for (const code of codes) {
          const t = val[code];
          const card = document.createElement("div");
          card.className = "trip-card";
          card.style.cursor = "default";
          card.innerHTML = `<div style="flex:1;min-width:0;"><h3></h3><div class="meta"></div></div>
            <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
              <span class="code-pill"></span><button type="button" class="btn-danger btn-sm">刪除</button></div>`;
          card.querySelector("h3").textContent = t.title || code;
          card.querySelector(".meta").textContent = `建立：${t.createdBy || "—"}`;
          card.querySelector(".code-pill").textContent = t.code || code;
          card.querySelector("button").addEventListener("click", async () => {
            if (!confirm(`確定刪除「${t.title || code}」？`)) return;
            await remove(tripRef(code));
            forgetJoined(code);
            refreshAdminTripList();
          });
          listEl.appendChild(card);
        }
      } catch (e) {
        listEl.innerHTML = "";
        emptyEl.textContent = "載入失敗：" + (e.message || e);
        emptyEl.classList.remove("hidden");
      }
    }

    async function createTrip() {
      const title = ($("newTripTitle").value || "").trim() || "未命名行程";
      let code = generateTripCode();
      for (let i = 0; i < 5; i++) {
        const snap = await get(tripRef(code));
        if (!snapExists(snap)) break;
        code = generateTripCode();
      }
      await set(tripRef(code), emptyTripPayload(title, code, accountName));
      rememberOwned(code);
      rememberJoined(code);
      $("newTripTitle").value = "";
      showEditor(code);
    }

    async function joinTrip() {
      const code = normalizeCode($("joinTripCode").value);
      if (!code || code.length < 4) { alert("請輸入有效行程碼"); return; }
      const snap = await get(tripRef(code));
      if (!snapExists(snap)) { alert("找不到此行程碼"); return; }
      const val = snap.val();
      const members = { ...(val.members || {}) };
      const already = !!members[accountName];
      members[accountName] = true;
      const now = new Date().toISOString();
      const hist = Array.isArray(val.history) ? val.history.slice() : [];
      if (!already) hist.unshift({ at: now, user: accountName, action: "加入行程", detail: code });
      await update(tripRef(code), { members, updatedAt: now, updatedBy: accountName, history: hist.slice(0, HISTORY_MAX) });
      rememberJoined(code);
      $("joinTripCode").value = "";
      showEditor(code);
    }

    /* ===== Boot ===== */
    if (document.documentElement.classList.contains("travel-gate-pending")) {
      $("travelCloudGate").setAttribute("aria-hidden", "false");
      wireUsernameField($("travelLoginUser"));
      wireUsernameField($("travelRegUser"));
      const regAvatarPreview = $("travelRegAvatarPreview");
      setAvatarPreview(regAvatarPreview, "", "?");
      $("travelRegAvatar")?.addEventListener("change", async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!file) return;
        if (file.size > 3 * 1024 * 1024) return setAuthMsg("頭像請小於 3MB。", true);
        try {
          pendingRegAvatarData = await compressAvatarFile(file);
          setAvatarPreview(regAvatarPreview, pendingRegAvatarData, ($("travelRegUser").value || "?").charAt(0));
        } catch (err) {
          setAuthMsg(err.message || String(err), true);
        }
      });
      $("travelRegUser")?.addEventListener("input", () => {
        setAvatarPreview(regAvatarPreview, pendingRegAvatarData, ($("travelRegUser").value || "?").charAt(0));
      });
      $("travelTabLogin").addEventListener("click", () => {
        $("travelLoginBlock").classList.remove("hidden");
        $("travelRegBlock").classList.add("hidden");
        $("travelTabLogin").classList.add("is-active");
        $("travelTabReg").classList.remove("is-active");
        setAuthMsg("", false);
      });
      $("travelTabReg").addEventListener("click", () => {
        $("travelLoginBlock").classList.add("hidden");
        $("travelRegBlock").classList.remove("hidden");
        $("travelTabReg").classList.add("is-active");
        $("travelTabLogin").classList.remove("is-active");
        setAuthMsg("", false);
      });
      $("travelBtnForgot")?.addEventListener("click", () => openForgotPasswordSheet());
      $("travelBtnSendRegCode")?.addEventListener("click", () => { handleSendRegCode(); });
      $("travelBtnLogin").addEventListener("click", async () => {
        const u = ($("travelLoginUser").value || "").trim();
        const p = $("travelLoginPass").value || "";
        setAuthMsg("", false);
        if (!u || !p) return setAuthMsg("請輸入帳號與密碼。", true);
        if (!/^[a-zA-Z0-9]+$/.test(u)) return setAuthMsg("帳號僅限英數字。", true);
        const btn = $("travelBtnLogin");
        btn.disabled = true; setGateLoading(true, "登入中…");
        try {
          if (u === ADMIN_USER && p === ADMIN_PASS) {
            await enterAfterAuth("admin", ADMIN_USER, { asAdmin: true });
            return;
          }
          const resolved = await resolveAccount(u);
          if (!resolved) return setAuthMsg("找不到帳號。", true);
          const acctSnap = await get(ref(rtdb, resolved.serial));
          if (!snapExists(acctSnap)) return setAuthMsg("帳號資料不存在。", true);
          const data = acctSnap.val();
          const hash = await sha256Hex(p);
          if (data[ACCT_HASH] !== hash) return setAuthMsg("帳號或密碼錯誤。", true);
          await enterAfterAuth(resolved.serial, data[ACCT_USER] || resolved.label);
        } catch (e) {
          setAuthMsg("登入失敗：" + (e.message || e), true);
        } finally { setGateLoading(false); btn.disabled = false; }
      });
      $("travelBtnReg").addEventListener("click", async () => {
        const u = ($("travelRegUser").value || "").trim();
        const email = ($("travelRegEmail").value || "").trim().toLowerCase();
        const code = ($("travelRegCode").value || "").trim();
        const p1 = $("travelRegPass").value || "";
        const p2 = $("travelRegPass2").value || "";
        setAuthMsg("", false);
        if (!u) return setAuthMsg("請輸入帳號。", true);
        if (!/^[a-zA-Z0-9]+$/.test(u)) return setAuthMsg("帳號僅限英數字。", true);
        if (u === ADMIN_USER) return setAuthMsg("此帳號保留給管理員。", true);
        if (!isValidEmail(email)) return setAuthMsg("請輸入有效電子信箱。", true);
        if (!code) return setAuthMsg("請輸入電子信箱驗證碼。", true);
        if (!consumeVerifyCode(email, "register", code)) return setAuthMsg("驗證碼錯誤或已過期。", true);
        if (!p1 || p1.length < 6) return setAuthMsg("密碼至少 6 碼。", true);
        if (p1 !== p2) return setAuthMsg("兩次密碼不一致。", true);
        const btn = $("travelBtnReg");
        btn.disabled = true; setGateLoading(true, "註冊中…");
        try {
          const idxRef = accountIndexRefFor(u);
          if (snapExists(await get(idxRef))) return setAuthMsg("帳號已被註冊。", true);
          const emailRef = accountEmailIndexRefFor(email);
          if (snapExists(await get(emailRef))) return setAuthMsg("此電子信箱已被使用。", true);
          const passHash = await sha256Hex(p1);
          const newAcct = push(ref(rtdb, "/"));
          await set(newAcct, {
            [ACCT_USER]: u,
            [ACCT_HASH]: passHash,
            [ACCT_EMAIL]: email,
            [ACCT_AVATAR]: pendingRegAvatarData || "",
          });
          await set(idxRef, newAcct.key);
          await set(emailRef, newAcct.key);
          if (pendingRegAvatarData) {
            setMyAvatarData(pendingRegAvatarData, newAcct.key, u);
            await publishAvatarToCloud(u, pendingRegAvatarData, newAcct.key);
          }
          await enterAfterAuth(newAcct.key, u);
        } catch (e) {
          setAuthMsg("註冊失敗：" + (e.message || e), true);
        } finally { setGateLoading(false); btn.disabled = false; }
      });
    } else {
      $("travelCloudGate").setAttribute("aria-hidden", "true");
      isAdmin = isAdminSession();
      $("travelUserName").textContent = isAdmin ? "admin（管理員）" : (accountName || "使用者");
      syncMyAvatarWithCloud().then(() => refreshAvatarViews()).catch(() => {});
      if (isAdmin) {
        $("homePanel").classList.add("hidden");
        $("adminPanel").classList.remove("hidden");
        $("homeSub").textContent = "管理員模式";
        refreshAdminTripList();
      }

      $("travelBtnLogout").addEventListener("click", () => {
        localStorage.removeItem(LS_SERIAL);
        localStorage.removeItem(LS_NAME);
        localStorage.removeItem(LS_SESSION);
        localStorage.removeItem(LS_ADMIN);
        localStorage.removeItem(LS_LAST_TRIP);
        sessionStorage.removeItem(LS_SESSION);
        location.reload();
      });
      $("btnAdminRefresh")?.addEventListener("click", () => refreshAdminTripList());
      $("btnCreateTrip")?.addEventListener("click", () => createTrip().catch((e) => alert(e.message || e)));
      $("btnJoinTrip")?.addEventListener("click", () => joinTrip().catch((e) => alert(e.message || e)));
      $("homeTabs")?.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-home-tab]");
        if (!btn) return;
        setHomeTab(btn.getAttribute("data-home-tab"));
      });
      $("btnBackHome").addEventListener("click", () => { clearPresence(); showHome(); });
      $("btnCopyCode").addEventListener("click", async () => {
        const code = ($("editTripCode").textContent || currentTripCode || "").trim();
        if (!code || code === "————") {
          showToast("目前沒有行程碼");
          return;
        }
        try {
          await navigator.clipboard.writeText(code);
          showToast("已複製行程碼 " + code);
        } catch {
          prompt("行程碼", code);
          showToast("請手動複製行程碼");
        }
      });
      $("btnLeaveTrip").addEventListener("click", () => {
        if (!currentTripCode) return;
        if (!confirm("確定移除此行程？")) return;
        clearPresence();
        forgetJoined(currentTripCode);
        clearLastTrip();
        showHome();
      });
      $("btnAddPlace").addEventListener("click", () => {
        if (!tripState || !tripState.content) return;
        if (!tripState.content.days[activeDayIdx]) return;
        const item = emptyItem({ time: "10:00", endTime: "11:00", place: "新景點" });
        draftPlace = { item, isWish: false, dayIdx: activeDayIdx };
        openPlaceSheet(item, activeDayIdx, false, "edit");
      });
      $("btnAddWish").addEventListener("click", () => {
        ensureContent();
        const item = emptyItem({ place: "想去的地方", time: "", endTime: "" });
        draftPlace = { item, isWish: true, dayIdx: -1 };
        openPlaceSheet(item, -1, true, "edit");
      });
      $("bottomNav").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tab]");
        if (btn) switchTab(btn.dataset.tab);
      });
      $("btnAddExpense").addEventListener("click", () => openExpenseSheet(null));
      $("btnOpenFx").addEventListener("click", openFxSheet);
      $("prepSeg").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-prep]");
        if (!b) return;
        document.querySelectorAll("#prepSeg button").forEach((x) => x.classList.toggle("is-active", x === b));
        $("prepLuggage").classList.toggle("hidden", b.dataset.prep !== "luggage");
        $("prepTasks").classList.toggle("hidden", b.dataset.prep !== "tasks");
        $("prepDocs").classList.toggle("hidden", b.dataset.prep !== "docs");
      });
      $("btnAddLuggage").addEventListener("click", () => {
        const text = prompt("行李項目");
        if (!text) return;
        ensureContent();
        tripState.content.checklists.luggage.push({ id: uid(), text: text.trim(), done: false });
        schedulePush({ action: "新增行李項目", detail: text });
        renderPrep();
      });
      $("btnAddTask").addEventListener("click", () => {
        ensureContent();
        const text = prompt("待辦內容");
        if (!text) return;
        const members = Object.keys(tripState.members || {});
        const assignee = prompt("指派給（" + members.join("/") + "）", accountName) || accountName;
        tripState.content.checklists.tasks.push({ id: uid(), text: text.trim(), assignee, done: false });
        schedulePush({ action: "新增待辦", detail: text });
        renderPrep();
      });
      $("docFileInput").addEventListener("change", async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!file || !tripState) return;
        if (file.size > 8 * 1024 * 1024) { alert("檔案請小於 8MB"); return; }
        ensureContent();
        const id = uid();
        const meta = {
          id, name: file.name, mime: file.type, size: file.size,
          uploadedBy: accountName, at: new Date().toISOString(),
        };
        await saveDocBlob(id, file, meta);
        tripState.content.documents.push(meta);
        schedulePush({ action: "上傳文件", detail: file.name });
        renderDocs();
      });

      $("btnMoreProfile")?.addEventListener("click", () => openProfileSheet());
      $("btnMoreTripSettings")?.addEventListener("click", () => openTripSettingsSheet());
      $("btnMoreHistory")?.addEventListener("click", () => openHistorySheet());

      $("sheetClose").addEventListener("click", closeSheet);
      $("sheetBackdrop").addEventListener("click", closeSheet);

      if (!isAdmin) {
        // 有上次行程：立刻進行程（本地快取先畫，Firebase 背景同步）
        // 不再先等主畫面列表，避免雙重等待
        openLastTripFast();
        pullJoinedCodesFromCloud().then(refreshTripList).catch(() => {});
      }

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js?v=3").catch(() => {});
      }
    }
    document.addEventListener("click", (e) => {
      const btn = e.target && e.target.closest && e.target.closest("#travelBtnSendRegCode");
      if (!btn) return;
      handleSendRegCode();
    });
  </script>
